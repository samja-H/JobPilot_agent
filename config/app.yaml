app:
  name: JobPilot-Agent
  env: local
  debug: false

server:
  host: 0.0.0.0
  port: 8000

frontend:
  port: 8501

llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.2

embedding:
  provider: mock
  model: mock-embedding
  dimension: 384

rag:
  chunk_size: 800
  chunk_overlap: 120
  top_k: 5
  score_threshold: 0.0
  enable_rerank: false

qdrant:
  host: localhost
  port: 6333
  collection_name: jobpilot_documents
  timeout: 10.0

database:
  type: sqlite
  sqlite_path: data/jobpilot.db

logging:
  level: INFO
  log_file: logs/jobpilot.log

agent:
  allowed_tools:
    - jd_analyzer
    - resume_matcher
    - resume_optimizer
    - interview_question_generator
