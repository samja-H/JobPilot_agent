[project]
name = "jobpilot-agent"
version = "0.1.0"
description = "Minimal FastAPI and Streamlit skeleton for a RAG and Tool Calling job-seeking agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "qdrant-client>=1.10,<2.0",
    "streamlit>=1.36,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.2,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

